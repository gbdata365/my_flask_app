[project]
name = "claude-data-analysis"
version = "0.1.0"
description = "Python data analysis and prediction modeling with Claude AI"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "koreanize-matplotlib>=0.1.1",
    "scikit-learn>=1.3.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "markdown>=3.10",
    "setuptools>=80.9.0",
    "anthropic>=0.75.0",
    "openai>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
